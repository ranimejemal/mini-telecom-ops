global:
  resolve_timeout: 5m

route:
  receiver: "noc-default"
  group_by: ["alertname", "server"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: "noc-critical"

receivers:
  # No notification channel yet: alerts are visible in the Alertmanager UI (:9093).
  # Later: email, Slack/Telegram, or a webhook to Rundeck/Ansible for auto-remediation.
  - name: "noc-default"
  - name: "noc-critical"

inhibit_rules:
  # If a server is DOWN, don't also fire its CPU/RAM/disk warnings.
  - source_matchers:
      - alertname="ServerDown"
    target_matchers:
      - severity="warning"
    equal: ["server"]
