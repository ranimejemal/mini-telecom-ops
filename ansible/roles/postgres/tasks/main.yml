---
- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present
    update_cache: true

- name: Ensure PostgreSQL is running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create telecom database
  community.postgresql.postgresql_db:
    name: "{{ postgres_database }}"
    state: present
  become_user: postgres

- name: Create telecom application user
  community.postgresql.postgresql_user:
    name: "{{ postgres_user }}"
    state: present
    password: "{{ postgres_password }}"
  become_user: postgres

- name: Grant database privileges to telecom application user
  community.postgresql.postgresql_privs:
    database: "{{ postgres_database }}"
    roles: "{{ postgres_user }}"
    type: database
    privs: CONNECT
    state: present
  become_user: postgres