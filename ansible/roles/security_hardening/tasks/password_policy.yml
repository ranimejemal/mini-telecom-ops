---
- name: Enforce password complexity (pwquality)
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: '^#?\s*{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: minlen, value: "{{ password_min_length }}" }
    - { key: dcredit, value: "-1" }
    - { key: ucredit, value: "-1" }
    - { key: lcredit, value: "-1" }
    - { key: ocredit, value: "-1" }
    - { key: retry, value: "3" }

- name: Enforce password ageing (login.defs)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^{{ item.key }}\s+'
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - { key: PASS_MAX_DAYS, value: "{{ password_max_days }}" }
    - { key: PASS_MIN_DAYS, value: "{{ password_min_days }}" }
    - { key: PASS_WARN_AGE, value: "{{ password_warn_age }}" }
