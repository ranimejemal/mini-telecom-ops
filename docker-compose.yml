# Kernel network hardening for the telecom servers (network sysctls are
# per-container namespaces; /proc/sys is read-only inside containers)
x-hardened-sysctls: &hardened-sysctls
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.tcp_syncookies: 1

services:

  web01:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: telecom-web01
    hostname: web01
    ports:
      - "8080:80"
      - "2221:22"
    volumes:
      - web_data:/var/www/html
    cap_add:
      - NET_ADMIN
    sysctls: *hardened-sysctls
    networks:
      telecom-net:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  db01:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    container_name: telecom-db01
    hostname: db01
    ports:
      - "2222:22"
    volumes:
      - db_data:/var/lib/postgresql
    cap_add:
      - NET_ADMIN
    sysctls: *hardened-sysctls
    networks:
      telecom-net:
        ipv4_address: 172.30.0.20
    restart: unless-stopped

  monitoring01:
    build:
      context: .
      dockerfile: docker/monitoring/Dockerfile
    container_name: telecom-monitoring01
    hostname: monitoring01
    ports:
      - "2223:22"
      - "9090:9090"
    volumes:
      - monitoring_data:/opt/monitoring
      - prometheus_data:/var/lib/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    cap_add:
      - NET_ADMIN
    sysctls: *hardened-sysctls
    networks:
      telecom-net:
        ipv4_address: 172.30.0.30
    restart: unless-stopped

  gitea:
    image: gitea/gitea:latest
    container_name: telecom-gitea
    hostname: gitea
    ports:
      - "3000:3000"
      - "2224:22"
    volumes:
      - gitea_data:/data
    networks:
      telecom-net:
        ipv4_address: 172.30.0.40
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: telecom-grafana
    hostname: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      telecom-net:
        ipv4_address: 172.30.0.60
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: telecom-alertmanager
    hostname: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      telecom-net:
        ipv4_address: 172.30.0.70
    restart: unless-stopped

  runner:
    image: gitea/act_runner:latest
    container_name: telecom-runner
    hostname: runner
    depends_on:
      - gitea
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://telecom-gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: telecom-runner
    volumes:
      - ./ci/runner/config.yaml:/config.yaml:ro
      - runner_data:/data
      # The runner starts CI jobs as sibling containers (security note: access to
      # the Docker socket is equivalent to root on the Docker host)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      telecom-net:
        ipv4_address: 172.30.0.80
    restart: unless-stopped

  # CI toolbox image used by the runner jobs (build only: docker compose build ci-image)
  ci-image:
    build:
      context: .
      dockerfile: ci/Dockerfile
    image: telecom-ci:latest
    profiles:
      - build

  # ---------------- SOC: Wazuh (manager + indexer + dashboard) ----------------
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.0
    container_name: telecom-wazuh-manager
    hostname: wazuh.manager
    env_file:
      - path: soc/secrets.env
        required: false
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - wazuh_filebeat_etc:/etc/filebeat
      - wazuh_filebeat_var:/var/lib/filebeat
      - ./soc/certs/root-ca.pem:/etc/ssl/root-ca.pem:ro
      - ./soc/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./soc/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./soc/config/wazuh_manager/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
    networks:
      telecom-net:
        ipv4_address: 172.30.0.90
        aliases:
          - wazuh.manager
    depends_on:
      - wazuh-indexer
    restart: unless-stopped

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.0
    container_name: telecom-wazuh-indexer
    hostname: wazuh.indexer
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./soc/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ./soc/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ./soc/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer-key.pem:ro
      - ./soc/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ./soc/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./soc/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./soc/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    networks:
      telecom-net:
        ipv4_address: 172.30.0.91
        aliases:
          - wazuh.indexer
    restart: unless-stopped

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.0
    container_name: telecom-wazuh-dashboard
    hostname: wazuh.dashboard
    env_file:
      - path: soc/secrets.env
        required: false
    environment:
      WAZUH_API_URL: https://wazuh.manager
    ports:
      # SOC console on the Docker host only
      - "127.0.0.1:5601:5601"
    volumes:
      - ./soc/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./soc/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./soc/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./soc/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
    networks:
      telecom-net:
        ipv4_address: 172.30.0.92
        aliases:
          - wazuh.dashboard
    depends_on:
      - wazuh-indexer
      - wazuh-manager
    restart: unless-stopped

  ansible:
    build:
      context: .
      dockerfile: ./docker/ansible/Dockerfile
    container_name: telecom-ansible
    hostname: ansible
    working_dir: /ansible
    volumes:
      - ./ansible:/ansible
      - ./docker:/docker
      - ./monitoring:/monitoring
      - ./docker/ansible/ssh:/ssh:ro
    networks:
      telecom-net:
        ipv4_address: 172.30.0.50
    restart: unless-stopped


volumes:

  web_data:
    name: telecom_web_data

  db_data:
    name: telecom_db_data

  monitoring_data:
    name: telecom_monitoring_data

  gitea_data:
    name: telecom_gitea_data

  prometheus_data:
    name: telecom_prometheus_data
    external: true

  grafana_data:
    name: telecom_grafana_data

  alertmanager_data:
    name: telecom_alertmanager_data

  runner_data:
    name: telecom_runner_data

  wazuh_api_configuration:
    name: telecom_wazuh_api_configuration
  wazuh_etc:
    name: telecom_wazuh_etc
  wazuh_logs:
    name: telecom_wazuh_logs
  wazuh_queue:
    name: telecom_wazuh_queue
  wazuh_var_multigroups:
    name: telecom_wazuh_var_multigroups
  wazuh_integrations:
    name: telecom_wazuh_integrations
  wazuh_active_response:
    name: telecom_wazuh_active_response
  wazuh_agentless:
    name: telecom_wazuh_agentless
  wazuh_wodles:
    name: telecom_wazuh_wodles
  wazuh_filebeat_etc:
    name: telecom_wazuh_filebeat_etc
  wazuh_filebeat_var:
    name: telecom_wazuh_filebeat_var
  wazuh_indexer_data:
    name: telecom_wazuh_indexer_data


networks:

  telecom-net:
    name: telecom-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
