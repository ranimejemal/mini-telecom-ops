# Kernel network hardening for the telecom servers (network sysctls are
# per-container namespaces; /proc/sys is read-only inside containers)
x-hardened-sysctls: &hardened-sysctls
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.tcp_syncookies: 1

services:

  web01:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: telecom-web01
    hostname: web01
    ports:
      - "8080:80"
      - "2221:22"
    volumes:
      - web_data:/var/www/html
    cap_add:
      - NET_ADMIN
    sysctls: *hardened-sysctls
    networks:
      telecom-net:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  db01:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    container_name: telecom-db01
    hostname: db01
    ports:
      - "2222:22"
    volumes:
      - db_data:/var/lib/postgresql
    cap_add:
      - NET_ADMIN
    sysctls: *hardened-sysctls
    networks:
      telecom-net:
        ipv4_address: 172.30.0.20
    restart: unless-stopped

  monitoring01:
    build:
      context: .
      dockerfile: docker/monitoring/Dockerfile
    container_name: telecom-monitoring01
    hostname: monitoring01
    ports:
      - "2223:22"
      - "9090:9090"
    volumes:
      - monitoring_data:/opt/monitoring
      - prometheus_data:/var/lib/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    cap_add:
      - NET_ADMIN
    sysctls: *hardened-sysctls
    networks:
      telecom-net:
        ipv4_address: 172.30.0.30
    restart: unless-stopped

  gitea:
    image: gitea/gitea:latest
    container_name: telecom-gitea
    hostname: gitea
    ports:
      - "3000:3000"
      - "2224:22"
    volumes:
      - gitea_data:/data
    networks:
      telecom-net:
        ipv4_address: 172.30.0.40
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: telecom-grafana
    hostname: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      telecom-net:
        ipv4_address: 172.30.0.60
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: telecom-alertmanager
    hostname: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      telecom-net:
        ipv4_address: 172.30.0.70
    restart: unless-stopped

  ansible:
    build:
      context: .
      dockerfile: ./docker/ansible/Dockerfile
    container_name: telecom-ansible
    hostname: ansible
    working_dir: /ansible
    volumes:
      - ./ansible:/ansible
      - ./docker:/docker
      - ./monitoring:/monitoring
      - ./docker/ansible/ssh:/ssh:ro
    networks:
      telecom-net:
        ipv4_address: 172.30.0.50
    restart: unless-stopped


volumes:

  web_data:
    name: telecom_web_data

  db_data:
    name: telecom_db_data

  monitoring_data:
    name: telecom_monitoring_data

  gitea_data:
    name: telecom_gitea_data

  prometheus_data:
    name: telecom_prometheus_data
    external: true

  grafana_data:
    name: telecom_grafana_data

  alertmanager_data:
    name: telecom_alertmanager_data


networks:

  telecom-net:
    name: telecom-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
